<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DitherForge</title>
  <meta name="description" content="DitherForge - a browser-based retro dithering tool." />
  <link rel="icon" type="image/webp" href="/assets/ditherforgelogo.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; font-family: 'Inter', sans-serif; }
    .boot-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      user-select: none;
    }
    .boot-loader-logo {
      height: 210px; width: auto; display: block;
      animation: boot-pulse 2.5s ease-in-out infinite;
      filter: none;
    }
    @keyframes boot-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-loader-logo { animation: none; }
    }
  </style>
</head>
<body>
  <div id="boot-loader" class="boot-loader" style="background:#333333" data-theme="dark_pro">
    <img id="boot-loader-logo" src="/assets/themes/dark_pro.webp" alt="DitherForge" class="boot-loader-logo" />
  </div>
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('ditherforge_theme') || 'dark_pro';
        var themeLogoMap = {
          'light_pro': '/assets/themes/light_pro.webp',
          'dark_pro': '/assets/themes/dark_pro.webp',
          'nord': '/assets/themes/nord.webp',
          'evergreen': '/assets/themes/evergreen.webp',
          'gruvbox': '/assets/themes/gruvbox.webp',
          'catppuccin_mocha': '/assets/themes/catppuccin_mocha.webp',
          'tokyo_night': '/assets/themes/tokyo_night.webp',
          'solarized_dark': '/assets/themes/solarized_dark.webp',
          'one_dark': '/assets/themes/one_dark.webp'
        };
        var themeBgMap = {
          'light_pro': '#DDDDE3',
          'dark_pro': '#333333',
          'nord': '#2e3440',
          'evergreen': '#1b241e',
          'gruvbox': '#282828',
          'catppuccin_mocha': '#1e1e2e',
          'tokyo_night': '#1a1b26',
          'solarized_dark': '#002b36',
          'one_dark': '#21252b'
        };
        var loader = document.getElementById('boot-loader');
        var logo = document.getElementById('boot-loader-logo');
        if (stored && themeBgMap[stored] && loader) {
          loader.style.background = themeBgMap[stored];
          loader.setAttribute('data-theme', stored);
        }
        if (stored && themeLogoMap[stored] && logo) {
          logo.src = themeLogoMap[stored];
        }
        if (stored) document.documentElement.setAttribute('data-theme', stored);
      } catch (e) {}
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
