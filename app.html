<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DitherForge</title>
  <meta name="description" content="DitherForge - a browser-based retro dithering tool." />
  <link rel="icon" type="image/webp" href="%BASE_URL%assets/ditherforgelogo.webp" />
  <style>
    :root {
      --bg: #333333;
    }
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      font-family: 'Inter Variable', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-synthesis: none;
      overflow: hidden;
      background: var(--bg);
    }
    #root {
      margin: 0;
      height: 100%;
      width: 100%;
    }
  </style>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('ditherforge_theme') || 'dark_pro';
        document.documentElement.setAttribute('data-theme', theme);
        var themeBgMap = {
          'light_pro': '#DDDDE3',
          'dark_pro': '#0D0E11',
          'dark': '#333333',
          'nord': '#2E3440',
          'evergreen': '#1B2A23',
          'gruvbox': '#282828',
          'catppuccin_mocha': '#1E1E2E',
          'tokyo_night': '#1A1B26',
          'kanagawa_wave': '#1F1F28',
          'rose_pine': '#191724',
          'dracula': '#1E1F29',
          'monokai_pro': '#221F22',
          'solarized_dark': '#002B36',
          'one_dark': '#21252B'
        };
        var bg = themeBgMap[theme] || '#333333';
        document.documentElement.style.setProperty('--bg', bg);
        document.documentElement.style.backgroundColor = bg;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
