name: 'Release Desktop Apps'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to target (e.g. v1.0)'
        required: false
        type: string
        default: 'v1.0'
      draft:
        description: 'Create draft release'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            os_name: 'windows'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            os_name: 'macos-arm64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            os_name: 'macos-x64'
          - platform: 'ubuntu-22.04'
            args: ''
            os_name: 'linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && (matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            rpm

      - name: Set RUSTFLAGS for target CPU
        run: |
          if [[ "${{ matrix.args }}" == *"aarch64"* ]]; then
            echo "RUSTFLAGS=" >> $GITHUB_ENV
            echo "RUSTFLAGS cleared for ARM64 target (x86-64-v2 not applicable)"
          else
            echo "RUSTFLAGS=-C target-cpu=x86-64-v2" >> $GITHUB_ENV
            echo "RUSTFLAGS set to x86-64-v2 for x86_64 target"
          fi

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v1.0' }}"
          releaseName: "DitherForge ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v1.0' }}"
          releaseBody: "DitherForge standalone desktop release for Windows, macOS, and Linux."
          releaseDraft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: false
          args: ${{ matrix.args }}
