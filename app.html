<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DitherForge</title>
  <meta name="description" content="DitherForge - a browser-based retro dithering tool." />
  <link rel="icon" type="image/webp" href="/assets/ditherforgelogo.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; font-family: 'Inter', sans-serif; }
    html, body, #root { margin: 0; height: 100%; width: 100%; background-color: #101014; }
  </style>
  <script>
    try {
      const t = localStorage.getItem('ditherforge_theme') || 'dark_pro';
      document.documentElement.setAttribute('data-theme', t);
      document.body.style.backgroundColor = 'transparent';
    } catch {}
  </script>
</head>
<body>
  <div id="boot-loader" class="boot-loader" style="background:#101014" data-theme="dark_pro">
  </div>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
